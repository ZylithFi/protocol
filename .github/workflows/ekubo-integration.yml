name: ekubo compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ekubo-integration.yml"
      - "contracts/Scarb.lock"
      - "contracts/Scarb.toml"
      - "contracts/src/ekubo_abi.cairo"
      - "contracts/src/ekubo_external_match_router.cairo"
      - "contracts/src/erc20.cairo"
      - "contracts/src/exchange.cairo"
      - "contracts/tests/ekubo_fork.cairo"
      - "contracts/tests/fixtures/exchange_fork*.txt"
  pull_request:
    paths:
      - ".github/workflows/ekubo-integration.yml"
      - "contracts/Scarb.lock"
      - "contracts/Scarb.toml"
      - "contracts/src/ekubo_abi.cairo"
      - "contracts/src/ekubo_external_match_router.cairo"
      - "contracts/src/erc20.cairo"
      - "contracts/src/exchange.cairo"
      - "contracts/tests/ekubo_fork.cairo"
      - "contracts/tests/fixtures/exchange_fork*.txt"

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd
        with:
          scarb-version: "2.18.0"
      - uses: foundry-rs/setup-snfoundry@16e23ddd0e2845f38727c92f4b913a7b728cda9e
        with:
          starknet-foundry-version: "0.61.0"
      - run: contracts/scripts/run_ekubo_mainnet_fork_tests.sh
